services:
  - type: web
    name: eventkit-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # On Free plan, data persists in project directory while instance is running.
      # If using a Render Persistent Disk (Starter plan or above), uncomment:
      # - key: EVENTKIT_STORAGE_PATH
      #   value: /var/data/eventkit
    # disk:
    #   name: eventkit-data
    #   mountPath: /var/data
    #   sizeGB: 1
